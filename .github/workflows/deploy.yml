name: Deploy Next.js App to cPanel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy & Restart via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 1. الانتقال لمجلد المشروع على السيرفر
            cd /home/radwanfs/public_html/web

            # 2. سحب آخر التعديلات من GitHub
            git pull origin master

            # 3. تفعيل بيئة Node 18 وتثبيت الـ Packages والـ Build
            source /home/radwanfs/nodevenv/public_html/web/18/bin/activate
            npm install --production --no-audit
            npm run build

            # 4. إعادة تشغيل التطبيق تلقائياً على Passenger
            mkdir -p tmp && touch tmp/restart.txt
